<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avant Groups | Empowering Growth</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- CRITICAL: This links your HTML to your design file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Modern Combined Header & Navigation -->
    <header class="main-header">
        <div class="container header-flex">
            <div class="logo-area">
                <!-- Logo Image -->
                <img src="logo.png" alt="Avant Groups Logo" class="site-logo">
            </div>
            <nav class="main-nav">
                <ul class="nav-links">
                    <li><a href="/" class="active">Home</a></li>
                    <li><a href="#">Our Group</a></li>
                    <li><a href="#">Investments</a></li>
                    <li><a href="#">News</a></li>
                    <li><a href="#">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Full-Width Hero Section -->
    <section class="hero-section">
        <div class="hero-overlay">
            <div class="container">
                <div class="hero-text">
                    <h2>Empowering Growth.<br>Investing in the Future.</h2>
                </div>
            </div>
        </div>
    </section>

    <!-- Diversified Portfolio Sectors -->
    <section class="portfolio-section container">
        <h3 class="section-title">Diversified Portfolio Sectors</h3>
        
        <div class="portfolio-grid">
            <!-- Card 1: Telecom -->
            <div class="portfolio-card">
                <div class="card-image telecom-img"></div>
                <div class="card-content">
                    <h4>Avant Telecom</h4>
                </div>
            </div>
            
            <!-- Card 2: Logistics -->
            <div class="portfolio-card">
                <div class="card-image logistics-img"></div>
                <div class="card-content">
                    <h4>Avant Logistics</h4>
                </div>
            </div>
            
            <!-- Card 3: Energy -->
            <div class="portfolio-card">
                <div class="card-image energy-img"></div>
                <div class="card-content">
                    <h4>Avant Energy</h4>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container" style="text-align: center; padding: 20px; color: #666; margin-top: 40px;">
            <p>&copy; 2026 Avant Groups. All Rights Reserved.</p>
        </div>
    </footer>

</body>
</html>
