<!-- contact.html (Dedicated Contact Us Page) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Avant Groups</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="logo.png" alt="Avant Groups Logo">
                </a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="our-group.html">Our Group</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="contact.html" class="active">Contact Us</a></li>
                </ul>
            </nav>
            <div class="lang-selector">
                <div id="google_translate_element"></div>
            </div>
        </div>
    </header>

    <main class="main-content">
        <section class="services-section" style="max-width: 700px; margin: 40px auto; padding: 0 20px;">
            <div style="background: #ffffff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #eaeaea;">
                <div class="modal-header" style="text-align: center; margin-bottom: 25px;">
                    <h2 style="font-size: 2rem; color: #0b192c; font-weight: 800; margin-bottom: 4px;">Connect With Us</h2>
                    <p style="font-size: 0.85rem; letter-spacing: 1.5px; color: #555; font-weight: 700;">AVANT GROUP</p>
                </div>
                
                <form id="contactForm" onsubmit="submitContactForm(event)">
                    <div class="form-group" style="margin-bottom: 18px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #333; letter-spacing: 0.5px; margin-bottom: 6px;">SERVICE REQUIRED</label>
                        <select name="service" required style="width: 100%; padding: 12px 15px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.95rem; color: #333; background-color: #fafbfc; outline: none;">
                            <option value="" disabled selected>Select a Service...</option>
                            <option value="Avant Telecom">Avant Telecom</option>
                            <option value="Avant IT Services">Avant IT Services</option>
                            <option value="Avant Logistics">Avant Logistics</option>
                            <option value="Avant Agro">Avant Agro</option>
                            <option value="Avant Energy">Avant Energy</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 18px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #333; letter-spacing: 0.5px; margin-bottom: 6px;">FULL NAME</label>
                        <input type="text" name="name" placeholder="John Doe" required style="width: 100%; padding: 12px 15px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.95rem; color: #333; background-color: #fafbfc; outline: none;">
                    </div>

                    <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 18px;">
                        <div class="form-group half" style="flex: 1;">
                            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #333; letter-spacing: 0.5px; margin-bottom: 6px;">EMAIL</label>
                            <input type="email" name="email" placeholder="john@company.com" required style="width: 100%; padding: 12px 15px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.95rem; color: #333; background-color: #fafbfc; outline: none;">
                        </div>
                        <div class="form-group half" style="flex: 1;">
                            <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #333; letter-spacing: 0.5px; margin-bottom: 6px;">PHONE</label>
                            <div class="phone-input-group" style="display: flex; gap: 8px;">
                                <select name="country_code" style="width: 115px; padding: 12px 6px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.85rem; background-color: #fafbfc; outline: none;">
                                    <option value="+93">+93 (AF)</option>
                                    <option value="+355">+355 (AL)</option>
                                    <option value="+213">+213 (DZ)</option>
                                    <option value="+54">+54 (AR)</option>
                                    <option value="+61">+61 (AU)</option>
                                    <option value="+43">+43 (AT)</option>
                                    <option value="+880">+880 (BD)</option>
                                    <option value="+32">+32 (BE)</option>
                                    <option value="+55">+55 (BR)</option>
                                    <option value="+1">+1 (CA/US)</option>
                                    <option value="+86">+86 (CN)</option>
                                    <option value="+33">+33 (FR)</option>
                                    <option value="+49">+49 (DE)</option>
                                    <option value="+30">+30 (GR)</option>
                                    <option value="+852">+852 (HK)</option>
                                    <option value="+36">+36 (HU)</option>
                                    <option value="+91" selected>+91 (IN)</option>
                                    <option value="+62">+62 (ID)</option>
                                    <option value="+353">+353 (IE)</option>
                                    <option value="+972">+972 (IL)</option>
                                    <option value="+39">+39 (IT)</option>
                                    <option value="+81">+81 (JP)</option>
                                    <option value="+60">+60 (MY)</option>
                                    <option value="+52">+52 (MX)</option>
                                    <option value="+31">+31 (NL)</option>
                                    <option value="+64">+64 (NZ)</option>
                                    <option value="+48">+48 (PL)</option>
                                    <option value="+351">+351 (PT)</option>
                                    <option value="+974">+974 (QA)</option>
                                    <option value="+40">+40 (RO)</option>
                                    <option value="+966">+966 (SA)</option>
                                    <option value="+65">+65 (SG)</option>
                                    <option value="+27">+27 (ZA)</option>
                                    <option value="+82">+82 (KR)</option>
                                    <option value="+34">+34 (ES)</option>
                                    <option value="+94">+94 (LK)</option>
                                    <option value="+46">+46 (SE)</option>
                                    <option value="+41">+41 (CH)</option>
                                    <option value="+886">+886 (TW)</option>
                                    <option value="+66">+66 (TH)</option>
                                    <option value="+90">+90 (TR)</option>
                                    <option value="+971">+971 (UAE)</option>
                                    <option value="+44">+44 (UK)</option>
                                    <option value="+84">+84 (VN)</option>
                                </select>
                                <input type="tel" name="phone" placeholder="98765 43210" required style="flex: 1; padding: 12px 15px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.95rem; background-color: #fafbfc; outline: none;">
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom: 22px;">
                        <label style="display: block; font-size: 0.75rem; font-weight: 700; color: #333; letter-spacing: 0.5px; margin-bottom: 6px;">MESSAGE</label>
                        <textarea name="message" rows="4" placeholder="How can we help you?" required style="width: 100%; padding: 12px 15px; border: 1px solid #e1e4e8; border-radius: 8px; font-size: 0.95rem; color: #333; background-color: #fafbfc; outline: none; resize: vertical;"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="submit-btn" style="width: 100%; padding: 14px; background-color: #0b192c; color: #ffffff; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; cursor: pointer; transition: background 0.2s;">SEND MESSAGE</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Avant Groups. All rights reserved.</p>
    </footer>

    <!-- Google Translate Script Initialization -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'en,hi,bn,as',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                autoDisplay: false
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        function submitContactForm(e) {
            e.preventDefault();
            const form = document.getElementById('contactForm');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'SENDING...';

            const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';
            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert('Thank you! Your message has been sent successfully to info@avantgroups.in');
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'SEND MESSAGE';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Submission failed. Please check your Google Apps Script Web App URL.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'SEND MESSAGE';
                });
        }
    </script>
</body>
</html>
