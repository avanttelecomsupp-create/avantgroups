    <script>
        function submitContactForm(e) {
            e.preventDefault();
            const form = document.getElementById('contactForm');
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'SENDING...';

            // Replace with your Google Apps Script Web App URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxfWKljA3VKb5K3_udBClhcobf0uDEQ6iR9p67srZGVs8rqIww61DjY5nv2xaxd8BpVow/exec';
            const formData = new FormData(form);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => {
                    alert('Thank you! Your message has been sent successfully, We will contact you Soon');
                    form.reset();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'SEND MESSAGE';
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    alert('Submission failed. Please check your Google Apps Script Web App URL.');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'SEND MESSAGE';
                });
        }
