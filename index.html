<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avant Groups - Empowering Growth</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo-container">
                <a href="index.html">
                    <img src="logo.png" alt="Avant Groups Logo">
                </a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="our-group.html">Our Group</a></li>
                    <li><a href="news.html">News</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Empowering Growth.<br>Investing in the Future.</h1>
        </div>
    </section>

    <main class="main-content">
        <section class="services-section">
            <h2>Diversified Portfolio Sectors</h2>
            <div class="services-grid">
                <div class="service-card telecom-card">
                    <div class="service-img">
                        <img src="photo/telecom_image.png" alt="Avant Telecom">
                    </div>
                    <div class="service-icon">
                        <i class="fas fa-broadcast-tower"></i>
                    </div>
                    <h3>Avant Telecom</h3>
                </div>

                <div class="service-card it-card">
                    <div class="service-img">
                        <img src="photo/it_image.png" alt="Avant IT Services">
                    </div>
                    <div class="service-icon">
                        <i class="fas fa-laptop-code"></i>
                    </div>
                    <h3>Avant IT Services</h3>
                </div>

                <div class="service-card logistics-card">
                    <div class="service-img">
                        <img src="photo/logistics_image.png" alt="Avant Logistics">
                    </div>
                    <div class="service-icon">
                        <i class="fas fa-shipping-fast"></i>
                    </div>
                    <h3>Avant Logistics</h3>
                </div>

                <div class="service-card agro-card">
                    <div class="service-img">
                        <img src="photo/agro_image.png" alt="Avant Agro">
                    </div>
                    <div class="service-icon">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <h3>Avant Agro</h3>
                </div>

                <div class="service-card energy-card">
                    <div class="service-img">
                        <img src="photo/energy_image.png" alt="Avant Energy">
                    </div>
                    <div class="service-icon">
                        <i class="fas fa-solar-panel"></i>
                    </div>
                    <h3>Avant Energy</h3>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Avant Groups. All rights reserved.</p>
    </footer>
</body>
</html>
